<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Formulir Pendaftaran Anggota Baru</title>
  <link rel="stylesheet" href="keren.css">
</head>
<body>
    <h2>Formulir Pendaftaran Anggota Baru</h2>

  <form action="#" method="POST">
    <div>
      <label for="nama">Nama Lengkap:</label>
      <input type="text" id="nama" name="nama" value="Isi nama Anda" required>
    </div><br>

    <div>
      <label for="email">Alamat Email:</label>
      <input type="email" id="email" name="email" value="nama@gmail.com" required>
    </div><br>

    <div>
      <label for="password">Kata Sandi:</label>
      <input type="password" id="password" name="password" value="password" required>
    </div><br>

     <div>
      <label>Pilih Minat Utama (Satu):</label><br>
      <input type="radio" id="web" name="minat" value="Pengembangan Web" checked>
      <label for="web">Pengembangan Web</label>

      <input type="radio" id="desain" name="minat" value="Desain Grafis">
      <label for="desain">Desain Grafis</label><br>

      <input type="radio" id="kriptografi" name="minat" value="Kriptografi">
      <label for="kriptografi">Kriptografi</label>

      <input type="radio" id="analis" name="minat" value="Analis Data">
      <label for="analis">Analis Data</label>
    </div><br>

    <div>
      <label>Area keahlian(Pilih semua yang sesuai):</label><br>
      <input type="checkbox" id="html" name="keahlian[]" value="HTML/CSS">
      <label for="html">HTML/CSS</label>

      <input type="checkbox" id="js" name="keahlian[]" value="JavaScript/Node.js">
      <label for="js">JavaScript/Node.js</label>

      <input type="checkbox" id="python" name="keahlian[]" value="Python">
      <label for="python">Python</label><br>

      <input type="checkbox" id="uiux" name="keahlian[]" value="Desain UI/UX">
      <label for="uiux">Desain UI/UX</label>

      <input type="checkbox" id="pemasaran" name="keahlian[]" value="Pemasaran Digital">
      <label for="pemasaran">Pemasaran Digital</label>
    </div><br>

    <div>
      <label for="negara">Negara asal:</label>
      <select id="negara" name="negara">
       <option value=""disabled selected>Pilih negara</option>
       <option value="indonesia">Indonesia</option>  
       <option value="Malaysia">Malaysia</option>
       <option value="Spanyol">Spanyol</option>
       <option value="Jepang">Jepang</option>
       <option value="Korea">Korea</option>
     </select>
    </div><br>

    <div>
      <button type="submit">Daftar Sekarang</button>
    </div>
  </form>
</body>
</html>
